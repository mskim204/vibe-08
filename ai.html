<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI에게 물어보기</title>
<script>
  // ===== 여기만 바꾸면 돼요 =====
  const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec"; // 선생님 중계 서버 주소
  const CLASS_CODE = "vibe7128";   // 수업 코드
  // AI 성격 목록 (버튼으로 고를 수 있어요)
  const PERSONAS = [
    { name: "📚 공부 도우미",   system: "너는 친절한 공부 도우미야." },
    { name: "🏃 체육 선생님",   system: "너는 엄격한 체육 선생님이야. 짧게 말해." },
    { name: "📜 조선시대 선비", system: "너는 조선시대 선비야. 옛날 말투로 말해." },
    { name: "🐱 고양이 인간",   system: "너는 고양이 말을 쓰는 고양이 인간이야." }
  ];
  let SYSTEM_PROMPT = PERSONAS[0].system; // 지금 고른 AI 성격 (처음엔 1번)
  const MAX_MESSAGES = 10; // AI에게 보낼 최근 대화 수 (질문 1개 = 1, 답 1개 = 1)
  // ==============================
</script>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 24px 16px; background: #f5f5ff; }
  h1 { text-align: center; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; font-size: 18px; padding: 10px; border: 2px solid #4f46e5; border-radius: 10px; }
  button { width: 100%; margin-top: 10px; padding: 14px; font-size: 20px; font-weight: bold; color: #fff; background: #4f46e5; border: none; border-radius: 10px; cursor: pointer; }
  button:disabled { background: #a5a3e8; cursor: wait; }
  #chat { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 14px; font-size: 18px; line-height: 1.6; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #4f46e5; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #fff; }
  .msg.error { align-self: flex-start; background: #fee2e2; }
  #empty { text-align: center; color: #888; }
  #newChat { background: #fff; color: #4f46e5; border: 2px solid #4f46e5; font-size: 17px; padding: 10px; }
  #thinking { display: none; margin-top: 14px; text-align: center; font-size: 18px; color: #4f46e5; }
  .error { color: #dc2626; }
  #personas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  #personas button { margin-top: 0; padding: 12px 6px; font-size: 17px; color: #4f46e5; background: #fff; border: 2px solid #4f46e5; }
  #personas button.selected { color: #fff; background: #4f46e5; }
  #current { text-align: center; color: #555; margin-bottom: 14px; }
  a { display: block; text-align: center; margin-top: 20px; color: #4f46e5; }
</style>
</head>
<body>
<h1>🤖 AI에게 물어보기</h1>

<div id="personas"></div>
<div id="current"></div>

<textarea id="question" placeholder="궁금한 것을 적어 보세요!"></textarea>
<button id="send">보내기</button>

<div id="chat"><div id="empty">여기에 대화가 나와요.</div></div>
<div id="thinking">🤔 생각 중…</div>
<button id="newChat">🧹 새 대화</button>

<a href="./">← 첫 화면으로</a>

<script>
  const questionBox = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const thinking = document.getElementById("thinking");
  const chatBox = document.getElementById("chat");
  const newChatBtn = document.getElementById("newChat");

  // 지금까지 나눈 질문과 답 (AI의 기억)
  let history = [];

  // 대화 칸에 말풍선 하나 추가
  function addBubble(role, text) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatBox.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  // [새 대화]: 기억 지우기
  newChatBtn.addEventListener("click", () => {
    history = [];
    chatBox.innerHTML = '<div id="empty">새 대화를 시작해요! 🙂</div>';
    questionBox.focus();
  });
  const personaBox = document.getElementById("personas");
  const currentBox = document.getElementById("current");

  // AI 성격 버튼 만들기
  PERSONAS.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.textContent = (i + 1) + ". " + p.name;
    btn.addEventListener("click", () => choosePersona(i));
    personaBox.appendChild(btn);
  });

  function choosePersona(i) {
    SYSTEM_PROMPT = PERSONAS[i].system;
    [...personaBox.children].forEach((b, j) => b.classList.toggle("selected", j === i));
    currentBox.textContent = "지금 성격: " + PERSONAS[i].system;
  }
  choosePersona(0);

  async function ask() {
    const question = questionBox.value.trim();
    if (!question) {
      questionBox.placeholder = "질문을 먼저 적어 주세요!";
      questionBox.focus();
      return;
    }

    addBubble("user", question);
    questionBox.value = "";
    sendBtn.disabled = true;
    thinking.style.display = "block";

    // 앞 대화 + 새 질문을 순서대로, 최근 MAX_MESSAGES개까지만
    let messages = [...history, { role: "user", content: question }].slice(-MAX_MESSAGES);
    // 맨 앞은 항상 질문(user)부터 시작하게
    if (messages[0].role !== "user") messages.shift();

    try {
      const res = await fetch(SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          code: CLASS_CODE,
          system: SYSTEM_PROMPT,
          messages: messages
        })
      });
      const data = await res.json();

      if (data.ok) {
        addBubble("assistant", data.text);
        // 성공한 질문과 답만 기억에 저장
        history.push({ role: "user", content: question });
        history.push({ role: "assistant", content: data.text });
      } else {
        addBubble("error", "⚠️ 오류: " + (data.error || "알 수 없는 오류"));
      }
    } catch (err) {
      addBubble("error", "⚠️ 서버에 연결하지 못했어요: " + err.message);
    } finally {
      sendBtn.disabled = false;
      thinking.style.display = "none";
    }
  }

  sendBtn.addEventListener("click", ask);
  // Enter로 보내기 (Shift+Enter는 줄바꿈)
  questionBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      ask();
    }
  });
</script>
</body>
</html>
