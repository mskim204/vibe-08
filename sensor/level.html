<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수평 맞추기</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: sans-serif;
    background: #111827;
    color: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    gap: 12px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top a { color: #9ca3af; font-size: 16px; text-decoration: none; }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; background: #1f2937; border-radius: 12px; padding: 6px; }
  .stat .label { font-size: 14px; color: #9ca3af; }
  .stat .val { font-size: 32px; font-weight: bold; font-variant-numeric: tabular-nums; }
  #best { color: #facc15; }
  #main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  /* 물방울 수평계 */
  #dish {
    position: relative;
    width: min(80vw, 46vh);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #14532d, #052e16);
    border: 6px solid #374151;
  }
  #dish.ok { background: radial-gradient(circle, #16a34a, #14532d); }
  #target {
    position: absolute;
    left: 50%; top: 50%;
    width: 24%; height: 24%;
    transform: translate(-50%, -50%);
    border: 4px dashed #ffffffaa;
    border-radius: 50%;
  }
  #bubble {
    position: absolute;
    left: 50%; top: 50%;
    width: 16%; height: 16%;
    margin: -8% 0 0 -8%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #a5f3fc);
    box-shadow: 0 0 12px #a5f3fc;
  }
  #angle { font-size: 18vw; font-weight: bold; line-height: 1; font-variant-numeric: tabular-nums; }
  .bar { height: 14px; background: #1f2937; border-radius: 7px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #22c55e; }
  button {
    padding: 18px 40px;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    background: #4f46e5;
    border: none;
    border-radius: 14px;
  }
  #msg { font-size: 20px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="top">
  <a href="./">← 센서</a>
  <b>🫧 수평 맞추기</b>
  <span style="width:48px"></span>
</div>
<div class="stats">
  <div class="stat"><div class="label">걸린 시간</div><div class="val" id="time">0.00</div></div>
  <div class="stat"><div class="label">최고 기록</div><div class="val" id="best">-</div></div>
</div>
<div id="angle">0°</div>
<div id="main"><div id="dish"><div id="target"></div><div id="bubble"></div></div></div>
<div class="bar"><div id="fill"></div></div>
<div id="msg">폰을 평평하게 들고 🫧 물방울을 가운데 원에 3초 동안 넣어요!</div>
<button id="start">시작</button>

<script>
const HOLD_SEC = 3;     // 이만큼 버티면 성공
const OK_DEG = 3;       // 이 각도 안이면 "평평하다"
const MAX_DEG = 20;     // 이만큼 기울면 물방울이 원 끝에 닿는다

const dishEl = document.getElementById('dish');
const bubbleEl = document.getElementById('bubble');
const angleEl = document.getElementById('angle');
const timeEl = document.getElementById('time');
const bestEl = document.getElementById('best');
const fillEl = document.getElementById('fill');
const msgEl = document.getElementById('msg');
const startBtn = document.getElementById('start');

// ----- 기록 -----
const BEST_KEY = 'level-best';
function loadBest() {
  try { return parseFloat(localStorage.getItem(BEST_KEY)) || null; } catch (e) { return null; }
}
function saveBest(t) {
  try { localStorage.setItem(BEST_KEY, String(t)); } catch (e) {}
}
let best = loadBest();
function showBest() { bestEl.textContent = best ? best.toFixed(2) : '-'; }
showBest();

// ----- 센서 -----
const tilt = { x: 0, y: 0 };
let sensorOn = false;

function onOrientation(e) {
  if (e.gamma == null || e.beta == null) return;
  tilt.x = e.gamma;
  tilt.y = e.beta;
}

// 물방울은 높은 쪽으로 간다 → 기울인 반대쪽으로 움직인다
function drawBubble() {
  let dx = -tilt.x / MAX_DEG, dy = -tilt.y / MAX_DEG;
  const d = Math.hypot(dx, dy);
  if (d > 1) { dx /= d; dy /= d; }
  const r = dishEl.clientWidth * 0.42;
  bubbleEl.style.transform = `translate(${dx * r}px, ${dy * r}px)`;
  const deg = Math.hypot(tilt.x, tilt.y);
  angleEl.textContent = deg.toFixed(1) + '°';
  return deg;
}

// ----- 게임 진행 -----
let playing = false, startTime = 0, holdStart = 0, lastBeep = 0;

function loop(now) {
  const deg = drawBubble();
  if (playing) {
    const t = (now - startTime) / 1000;
    timeEl.textContent = t.toFixed(2);
    const ok = deg <= OK_DEG;
    dishEl.classList.toggle('ok', ok);
    if (ok) {
      if (!holdStart) holdStart = now;
      const held = (now - holdStart) / 1000;
      fillEl.style.width = Math.min(100, held / HOLD_SEC * 100) + '%';
      msgEl.textContent = `좋아요! 버텨요… ${Math.max(0, HOLD_SEC - held).toFixed(1)}초`;
      if (held >= HOLD_SEC) { finish(t); }
    } else {
      if (holdStart) msgEl.textContent = '앗, 흔들렸어요! 다시 가운데로!';
      holdStart = 0;
      fillEl.style.width = '0';
    }
  }
  requestAnimationFrame(loop);
}

function finish(t) {
  playing = false;
  if (navigator.vibrate) try { navigator.vibrate(300); } catch (e) {}
  if (!best || t < best) {
    best = t;
    saveBest(t);
    showBest();
    msgEl.textContent = `🎉 성공! ${t.toFixed(2)}초 — 새 최고 기록!`;
  } else {
    msgEl.textContent = `✅ 성공! ${t.toFixed(2)}초`;
  }
  startBtn.textContent = '다시 하기';
  startBtn.style.display = '';
}

async function askPermission(Ev) {
  // 아이폰(iOS 13+)은 버튼을 누를 때 권한을 물어봐야 한다
  if (Ev && typeof Ev.requestPermission === 'function') {
    return (await Ev.requestPermission()) !== 'denied';
  }
  return true;
}

startBtn.addEventListener('click', async () => {
  if (!sensorOn) {
    try {
      if (!(await askPermission(window.DeviceOrientationEvent))) {
        msgEl.textContent = '센서 권한이 거부됐어요. 설정에서 허용해 주세요.';
        return;
      }
    } catch (e) {
      msgEl.textContent = '권한을 물어볼 수 없어요. https 주소로 열어 주세요.';
      return;
    }
    window.addEventListener('deviceorientation', onOrientation);
    sensorOn = true;
  }
  startBtn.style.display = 'none';
  fillEl.style.width = '0';
  msgEl.textContent = '🫧 물방울을 가운데 원에 넣어요!';
  holdStart = 0;
  playing = true;
  startTime = performance.now();
});

// 컴퓨터에서 시험할 때는 방향키로 기울이기
window.addEventListener('keydown', e => {
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (k) { tilt.x += k[0]; tilt.y += k[1]; }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
