<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 퀴즈 만들기</title>
<script>
  // ===== 여기만 바꾸면 돼요 =====
  const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec"; // 선생님 중계 서버 주소
  const CLASS_CODE = "vibe7128";   // 수업 코드
  const QUIZ_COUNT = 5;            // 문제 수
  // AI에게 주는 규칙 (JSON 배열로만 답하게)
  const SYSTEM_PROMPT =
    "너는 중학생용 퀴즈 출제자야. 반드시 JSON 배열로만 답해. 설명, 인사, 마크다운, ``` 는 절대 쓰지 마. " +
    '모양: [{"문제":"","보기":["","","",""],"정답":1}] ' +
    "보기는 꼭 4개, 정답은 맞는 보기의 번호(1~4 숫자)야.";
  // ==============================
</script>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 24px 16px; background: #f5f5ff; }
  h1 { text-align: center; }
  input { width: 100%; box-sizing: border-box; font-size: 18px; padding: 12px; border: 2px solid #4f46e5; border-radius: 10px; }
  button { width: 100%; margin-top: 10px; padding: 14px; font-size: 20px; font-weight: bold; color: #fff; background: #4f46e5; border: none; border-radius: 10px; cursor: pointer; }
  button:disabled { background: #a5a3e8; cursor: wait; }
  #thinking { display: none; margin-top: 14px; text-align: center; font-size: 18px; color: #4f46e5; }
  #error { margin-top: 14px; padding: 12px; border-radius: 10px; background: #fee2e2; color: #b91c1c; display: none; white-space: pre-wrap; }
  #quiz { display: none; margin-top: 20px; background: #fff; border-radius: 14px; padding: 18px; }
  #info { display: flex; justify-content: space-between; color: #555; font-size: 16px; }
  #question { font-size: 20px; font-weight: bold; line-height: 1.5; margin: 12px 0; }
  .choice { text-align: left; font-size: 18px; font-weight: normal; color: #222; background: #eef2ff; border: 2px solid #c7d2fe; }
  .choice:disabled { cursor: default; background: #eef2ff; }
  .choice.correct { background: #dcfce7; border-color: #16a34a; }
  .choice.wrong { background: #fee2e2; border-color: #dc2626; }
  #result { margin-top: 12px; font-size: 20px; font-weight: bold; text-align: center; min-height: 28px; }
  #next { display: none; }
  #done { display: none; margin-top: 20px; text-align: center; background: #fff; border-radius: 14px; padding: 18px; }
  #finalScore { font-size: 26px; font-weight: bold; color: #4f46e5; }
  #csv { background: #16a34a; }
  a { display: block; text-align: center; margin-top: 20px; color: #4f46e5; }
</style>
</head>
<body>
<h1>📝 AI 퀴즈 만들기</h1>

<input id="topic" placeholder="퀴즈 주제를 적어 보세요 (예: 태양계)">
<button id="make">문제 만들기</button>
<div id="thinking">🤔 문제 만드는 중… (10~20초쯤 걸려요)</div>
<div id="error"></div>

<div id="quiz">
  <div id="info"><span id="count"></span><span id="score"></span></div>
  <div id="question"></div>
  <div id="choices"></div>
  <div id="result"></div>
  <button id="next">다음 문제 ▶</button>
</div>

<div id="done">
  <div>🎉 퀴즈 끝!</div>
  <div id="finalScore"></div>
  <button id="csv">💾 CSV 저장</button>
</div>

<a href="./">← 첫 화면으로</a>

<script>
  const topicBox = document.getElementById("topic");
  const makeBtn = document.getElementById("make");
  const thinking = document.getElementById("thinking");
  const errorBox = document.getElementById("error");
  const quizBox = document.getElementById("quiz");
  const doneBox = document.getElementById("done");
  const nextBtn = document.getElementById("next");

  let quiz = [];   // AI가 만든 문제들
  let now = 0;     // 지금 몇 번째 문제인지 (0부터)
  let score = 0;   // 맞힌 개수

  function showError(text) {
    errorBox.textContent = "⚠️ " + text;
    errorBox.style.display = "block";
  }

  // AI 답에서 JSON 배열만 꺼내서 검사하기
  function parseQuiz(text) {
    const start = text.indexOf("[");
    const end = text.lastIndexOf("]");
    if (start < 0 || end < start) throw new Error("AI가 JSON 배열로 답하지 않았어요.");
    const list = JSON.parse(text.slice(start, end + 1));
    const good = list.filter(q =>
      q && typeof q.문제 === "string" &&
      Array.isArray(q.보기) && q.보기.length === 4 &&
      [1, 2, 3, 4].includes(Number(q.정답))
    ).map(q => ({ 문제: q.문제, 보기: q.보기.map(String), 정답: Number(q.정답) }));
    if (good.length === 0) throw new Error("쓸 수 있는 문제가 없어요.");
    return good.slice(0, QUIZ_COUNT);
  }

  async function makeQuiz() {
    const topic = topicBox.value.trim();
    if (!topic) {
      topicBox.placeholder = "주제를 먼저 적어 주세요!";
      topicBox.focus();
      return;
    }
    makeBtn.disabled = true;
    thinking.style.display = "block";
    errorBox.style.display = "none";
    quizBox.style.display = "none";
    doneBox.style.display = "none";

    try {
      const res = await fetch(SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          code: CLASS_CODE,
          system: SYSTEM_PROMPT,
          messages: [{ role: "user", content: "주제: " + topic + "\n이 주제로 4지선다 문제 " + QUIZ_COUNT + "개를 JSON 배열로만 만들어 줘." }]
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error("오류: " + (data.error || "알 수 없는 오류"));
      quiz = parseQuiz(data.text);
      now = 0;
      score = 0;
      quizBox.style.display = "block";
      showQuestion();
    } catch (err) {
      showError("문제를 만들지 못했어요. 다시 눌러 보세요.\n(" + err.message + ")");
    } finally {
      makeBtn.disabled = false;
      thinking.style.display = "none";
    }
  }

  // 지금 문제 보여 주기
  function showQuestion() {
    const q = quiz[now];
    document.getElementById("count").textContent = (now + 1) + " / " + quiz.length + "번";
    document.getElementById("score").textContent = "점수: " + score;
    document.getElementById("question").textContent = q.문제;
    document.getElementById("result").textContent = "";
    nextBtn.style.display = "none";
    const box = document.getElementById("choices");
    box.innerHTML = "";
    q.보기.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.textContent = (i + 1) + ". " + text;
      btn.addEventListener("click", () => choose(i + 1));
      box.appendChild(btn);
    });
  }

  // 보기를 골랐을 때
  function choose(pick) {
    const q = quiz[now];
    const buttons = [...document.querySelectorAll(".choice")];
    buttons.forEach(b => b.disabled = true);
    buttons[q.정답 - 1].classList.add("correct");
    const result = document.getElementById("result");
    if (pick === q.정답) {
      score++;
      result.textContent = "⭕ 맞았어요!";
      result.style.color = "#16a34a";
    } else {
      buttons[pick - 1].classList.add("wrong");
      result.textContent = "❌ 틀렸어요! 정답은 " + q.정답 + "번";
      result.style.color = "#dc2626";
    }
    document.getElementById("score").textContent = "점수: " + score;
    nextBtn.textContent = now + 1 < quiz.length ? "다음 문제 ▶" : "결과 보기 🏁";
    nextBtn.style.display = "block";
  }

  nextBtn.addEventListener("click", () => {
    now++;
    if (now < quiz.length) {
      showQuestion();
    } else {
      quizBox.style.display = "none";
      doneBox.style.display = "block";
      document.getElementById("finalScore").textContent = quiz.length + "문제 중 " + score + "개 맞았어요!";
    }
  });

  // CSV 칸 하나 만들기 (쉼표·따옴표·줄바꿈이 있어도 안 깨지게)
  function cell(v) {
    return '"' + String(v).replace(/"/g, '""') + '"';
  }

  // [CSV 저장]: 문제.csv 내려받기
  document.getElementById("csv").addEventListener("click", () => {
    const rows = [["문제", "보기1", "보기2", "보기3", "보기4", "정답"]];
    quiz.forEach(q => rows.push([q.문제, ...q.보기, q.정답]));
    const csv = rows.map(r => r.map(cell).join(",")).join("\r\n");
    // 맨 앞의 ﻿(BOM) 덕분에 엑셀에서 한글이 안 깨져요
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "문제.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  makeBtn.addEventListener("click", makeQuiz);
  // Enter로 문제 만들기 (한글 입력 중에는 무시)
  topicBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing && !makeBtn.disabled) makeQuiz();
  });
</script>
</body>
</html>
