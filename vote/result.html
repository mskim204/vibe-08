<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; padding: 30px 16px; background: #fff7ed; margin: 0; }
  h1 { text-align: center; margin-top: 0; }
  .chart { max-width: 600px; margin: 0 auto; }
  .row { display: flex; align-items: center; margin: 16px 0; gap: 10px; }
  .label { width: 100px; font-size: 20px; font-weight: bold; flex-shrink: 0; }
  .track { flex: 1; background: #ffedd5; border-radius: 10px; height: 40px; overflow: hidden; }
  .bar { height: 100%; width: 0; border-radius: 10px; transition: width 0.6s; }
  .count { width: 50px; font-size: 20px; font-weight: bold; text-align: right; flex-shrink: 0; }
  #total { text-align: center; font-size: 20px; color: #555; margin-top: 24px; }
</style>
</head>
<body>
<h1>📊 투표 결과</h1>
<div class="chart" id="chart"></div>
<div id="total"></div>

<script>
  var EMOJI = { '떡볶이': '🌶️', '치킨': '🍗', '마라탕': '🍲', '붕어빵': '🐟' };
  var COLOR = { '떡볶이': '#ef4444', '치킨': '#f59e0b', '마라탕': '#8b5cf6', '붕어빵': '#0ea5e9' };
  var chart = document.getElementById('chart');

  function draw(results) {
    var max = Math.max.apply(null, results.map(function (r) { return r.count; })) || 1;
    var total = results.reduce(function (s, r) { return s + r.count; }, 0);
    if (!chart.children.length) {
      results.forEach(function (r) {
        chart.innerHTML += '<div class="row"><div class="label">' + EMOJI[r.name] + ' ' + r.name +
          '</div><div class="track"><div class="bar" style="background:' + COLOR[r.name] +
          '"></div></div><div class="count"></div></div>';
      });
    }
    results.forEach(function (r, i) {
      var row = chart.children[i];
      row.querySelector('.bar').style.width = (r.count / max * 100) + '%';
      row.querySelector('.count').textContent = r.count + '표';
    });
    document.getElementById('total').textContent = '총 ' + total + '표';
  }

  function load() {
    google.script.run.withSuccessHandler(draw).getResults();
  }
  load();
  setInterval(load, 5000); // 5초마다 새로고침
</script>
</body>
</html>
